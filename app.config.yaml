application:
  actions: actions
  web: web-src
  runtimeManifest:
    packages:
      wayfinder:
        license: Apache-2.0
        actions:
          generic:
            function: actions/generic/index.js
            web: 'yes'
            runtime: nodejs:22
            inputs:
              LOG_LEVEL: debug
            annotations:
              require-adobe-auth: true
              final: true
          publish-events:
            function: actions/publish-events/index.js
            web: 'yes'
            runtime: nodejs:22
            inputs:
              LOG_LEVEL: debug
              apiKey: $SERVICE_API_KEY
            annotations:
              require-adobe-auth: true
              final: true
          mcp:
            function: actions/mcp/index.js
            web: 'raw'
            runtime: nodejs:22
            inputs:
              MCP_API_KEY: $MCP_API_KEY
              LANGSMITH_API_KEY: $LANGSMITH_API_KEY
            annotations:
              require-adobe-auth: false
              final: true
